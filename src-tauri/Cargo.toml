[package]
name = "thorn-intelligence"
version = "0.1.0"
description = "Local-first storage intelligence desktop app"
authors = ["ThornIntelligence contributors"]
edition = "2021"

[lib]
name = "thorn_intelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
blake3 = "1"
same-file = "1"

[dev-dependencies]
tempfile = "3"
