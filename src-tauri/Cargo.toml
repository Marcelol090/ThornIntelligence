[package]
name = "thorn-intelligence"
version = "0.1.0"
description = "Local-first storage intelligence desktop app"
authors = ["ThornIntelligence contributors"]
edition = "2021"

[lib]
name = "thorn_intelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
blake3 = { version = "1", features = ["rayon"] }
same-file = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
